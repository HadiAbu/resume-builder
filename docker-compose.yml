services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_builder}
      POSTGRES_USER: ${POSTGRES_USER:-resume_builder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_builder}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_builder} -d ${POSTGRES_DB:-resume_builder}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resume_builder}:${POSTGRES_PASSWORD:-resume_builder}@db:5432/${POSTGRES_DB:-resume_builder}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-only-secret-not-for-production-use}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  db-data:
